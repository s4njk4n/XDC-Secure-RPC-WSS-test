# Publishes xdc-rpc.sh as a GitHub Release. Run it from the Actions tab
# ("Release" → "Run workflow") after bumping XDC_RPC_VERSION. See MAINTAINING.md.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read the version from xdc-rpc.sh
        id: version
        run: |
          v=$(grep -m1 -oE '^XDC_RPC_VERSION="[0-9]+\.[0-9]+\.[0-9]+"' xdc-rpc.sh | cut -d'"' -f2)
          if [ -z "$v" ]; then echo "::error::XDC_RPC_VERSION isn't set in xdc-rpc.sh"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            echo "::error::Version $v has already been released. Bump XDC_RPC_VERSION in xdc-rpc.sh first."
            exit 1
          fi
          echo "version=$v" >>"$GITHUB_OUTPUT"

      - name: Check the script
        run: |
          bash -n xdc-rpc.sh
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck -s bash -S warning xdc-rpc.sh

      - name: Make the release files
        run: |
          mkdir dist
          cp xdc-rpc.sh dist/
          cd dist && sha256sum xdc-rpc.sh >xdc-rpc.sh.sha256 && cat xdc-rpc.sh.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Release notes: the CHANGELOG.md section for this version
          awk -v v="$VERSION" 'index($0, "## " v) == 1 {f = 1; next} f && /^## / {exit} f' CHANGELOG.md >notes.md
          [ -s notes.md ] || echo "xdc-rpc $VERSION" >notes.md
          # Draft first, attach the files, then publish (works with immutable releases)
          gh release create "v$VERSION" --draft --title "v$VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          gh release upload "v$VERSION" dist/xdc-rpc.sh dist/xdc-rpc.sh.sha256
          gh release edit "v$VERSION" --draft=false --latest
